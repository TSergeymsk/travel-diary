# ============================================================
#  Travel Diary — конфигурация
#  Зрение — локально (Ollama), тексты — в облако (Groq/OpenRouter).
# ============================================================

runtime:
  ollama_host: http://192.168.2.2:11434
  phase_mode: true
  preload: true
  unload_between_phases: true
  keep_alive: 30m

fallback:
  enabled: true
  reduce_role: reduce
  hard_truncate_sentences: 3
  auto_reduce_over_chars: 0

roles:

  # ============ Vision: локально ============
  vision:
    fallback_role: reduce
    empty_result: "Кадры этого места"
    chain:
      - backend: ollama
        model: minicpm-v4.5:8b
        label: local-minicpm
        keep_alive: 30m
        temperature: 0.4
        max_tokens: 400
        num_ctx: 4096

      - backend: ollama
        model: llava:7b
        label: local-llava
        keep_alive: 30m
        temperature: 0.4
        max_tokens: 400
        num_ctx: 4096

      - backend: ollama
        model: moondream:latest
        label: local-moondream
        temperature: 0.3
        max_tokens: 300
        num_ctx: 2048

  # ============ Text: облако ============
  text:
    fallback_role: reduce
    empty_result: ""
    chain:
      # 1. Основная модель — 70b на Groq, лучшее качество
      - backend: groq
        model: llama-3.3-70b-versatile
        label: groq-70b
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.85
        max_tokens: 1200

      # 2. Быстрый резерв на Groq, спасает при 429 на 70b
      - backend: groq
        model: llama-3.1-8b-instant
        label: groq-8b
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.85
        max_tokens: 1200

      # 3. Аварийный роутер OpenRouter — сам выберет свободную free-модель
      - backend: openrouter
        model: openrouter/free
        label: openrouter-free-router
        api_key_env: OPENROUTER_API_KEY
        base_url: https://openrouter.ai/api/v1
        temperature: 0.85
        max_tokens: 1200

  # ============ Proofread: облако, лёгкая модель ============
  # Правка не требует 70b, поэтому основной — 8b на Groq (много квоты).
  proofread:
    empty_result: ""
    chain:
      - backend: groq
        model: llama-3.1-8b-instant
        label: groq-8b-proof
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.15
        max_tokens: 1500

      - backend: groq
        model: llama-3.3-70b-versatile
        label: groq-70b-proof
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.15
        max_tokens: 1500

      - backend: openrouter
        model: openrouter/free
        label: openrouter-free-proof
        api_key_env: OPENROUTER_API_KEY
        base_url: https://openrouter.ai/api/v1
        temperature: 0.15
        max_tokens: 1500

  # ============ Reduce: локальный, на самый крайний случай ============
  # Срабатывает только если и Groq, и OpenRouter недоступны.
  reduce:
    empty_result: ""
    chain:
      - backend: ollama
        model: qwen2.5-coder:1.5b
        label: local-tiny
        keep_alive: 5m
        max_tokens: 250
        num_ctx: 4096

      - backend: ollama
        model: qwen2.5:7b
        label: local-qwen2.5
        max_tokens: 250
        num_ctx: 4096

# ---------- Параметры обработки ----------
processing:
  vision_max_side: 512
  export_max_side: 1600
  cluster_radius_m: 400
  max_images_per_cluster: 2
  use_reverse_geocode: true

  # ---- Дедупликация и диверсификация фото ----
  max_photos_per_day: 6
  dedup_time_window_s: 5
  dedup_hash_threshold: 10
  max_photos_per_cluster: 2

  # ---- Интерполяция GPS из GPX ----
  gps_interpolation_from_gpx: true
  gps_interpolation_max_gap_min: 30
  photo_tz_offset_hours: 3

# ---------- Обогащение из интернета ----------
search:
  enabled: true
  language: ru
  max_chars: 600
  timeout: 8

# ---------- Вывод ----------
output:
  title: "Моё путешествие"
  theme: dark