# ============================================================
#  Travel Diary — конфигурация
#  Зрение — локально (Ollama), тексты — в облако (Groq/OpenRouter).
# ============================================================

runtime:
  ollama_host: http://192.168.2.2:11434
  phase_mode: true
  preload: true
  unload_between_phases: true
  keep_alive: 30m

  retry:
    max_attempts: 4
    base_backoff_s: 2.0
    max_backoff_s: 45.0
    jitter_s: 1.0

fallback:
  enabled: true
  reduce_role: reduce
  hard_truncate_sentences: 3
  auto_reduce_over_chars: 0

roles:

  # ============ Vision: локально ============
  vision:
    fallback_role: reduce
    empty_result: "Кадры этого места"
    chain:
      - backend: ollama
        model: minicpm-v4.5:8b
        label: local-minicpm
        keep_alive: 30m
        temperature: 0.4
        max_tokens: 400
        num_ctx: 4096

      - backend: ollama
        model: llava:7b
        label: local-llava
        keep_alive: 30m
        temperature: 0.4
        max_tokens: 400
        num_ctx: 4096

      - backend: ollama
        model: moondream:latest
        label: local-moondream
        temperature: 0.3
        max_tokens: 300
        num_ctx: 2048

  # ============ Text: облако ============
  text:
    fallback_role: reduce
    empty_result: ""
    chain:
      - backend: groq
        model: openai/gpt-oss-120b
        label: groq-120b
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.85
        max_tokens: 1200
        reasoning_effort: low
        rate_limit:
          rpm: 25
          tpm: 7000
          min_interval_s: 0.5

      - backend: groq
        model: qwen/qwen3.8-27b
        label: groq-qwen27
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.85
        max_tokens: 1200
        reasoning_effort: low
        rate_limit:
          rpm: 25
          tpm: 7000
          min_interval_s: 0.5

      - backend: groq
        model: openai/gpt-oss-20b
        label: groq-20b
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.85
        max_tokens: 1200
        reasoning_effort: low
        rate_limit:
          rpm: 25
          tpm: 7000
          min_interval_s: 0.5

      - backend: openrouter
        model: openrouter/free
        label: openrouter-free-router
        api_key_env: OPENROUTER_API_KEY
        base_url: https://openrouter.ai/api/v1
        temperature: 0.85
        max_tokens: 1200
        rate_limit:
          rpm: 15
          tpm: 0
          min_interval_s: 1.0

  # ============ Proofread: облако, лёгкая модель ============
  proofread:
    empty_result: ""
    chain:
      - backend: groq
        model: openai/gpt-oss-20b
        label: groq-20b-proof
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.15
        max_tokens: 1500
        reasoning_effort: low
        rate_limit:
          rpm: 25
          tpm: 7000
          min_interval_s: 0.5

      - backend: groq
        model: openai/gpt-oss-120b
        label: groq-120b-proof
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.15
        max_tokens: 1500
        reasoning_effort: low
        rate_limit:
          rpm: 25
          tpm: 7000
          min_interval_s: 0.5

      - backend: openrouter
        model: openrouter/free
        label: openrouter-free-proof
        api_key_env: OPENROUTER_API_KEY
        base_url: https://openrouter.ai/api/v1
        temperature: 0.15
        max_tokens: 1500
        rate_limit:
          rpm: 15
          tpm: 0
          min_interval_s: 1.0

  # ============ Reduce: локальный ============
  reduce:
    empty_result: ""
    chain:
      - backend: ollama
        model: qwen2.5-coder:1.5b
        label: local-tiny
        keep_alive: 5m
        max_tokens: 250
        num_ctx: 4096

      - backend: ollama
        model: qwen2.5:7b
        label: local-qwen2.5
        max_tokens: 250
        num_ctx: 4096

# ---------- Параметры обработки ----------
processing:
  vision_max_side: 512
  export_max_side: 1600
  cluster_radius_m: 400
  max_images_per_cluster: 2
  use_reverse_geocode: true

  use_file_mtime_fallback: true
  photo_tz_offset_hours: 8

  max_photos_per_day: 6
  max_photos_per_location: 4
  dedup_time_window_s: 5
  dedup_hash_threshold: 10
  max_photos_per_cluster: 2

  significant_min_photos: 3
  significant_require_wiki: false
  day_intro_min_locations: 2
  generate_route_overview: true

  transit_min_clusters: 2
  transit_min_photos: 3

  gps_interpolation_from_gpx: true
  gps_interpolation_max_gap_min: 30

# ---------- Обогащение из интернета ----------
search:
  enabled: true
  language: ru
  max_chars: 600
  timeout: 8
  radius_m: 5000          # радиус геопоиска
  max_dist_m: 2000        # ближе этого — считаем, что статья «про это место»

# ---------- Вывод ----------
output:
  title: "Моё путешествие"
  theme: light