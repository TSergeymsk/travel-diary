# ============================================================
#  Travel Diary — конфигурация
# ============================================================

# ---------- Управление VRAM Ollama ----------
runtime:
  # Адрес Ollama-сервера. Если Ollama на другом ПК — укажите его IP.
  # Примеры:
  #   http://localhost:11434
  #   http://192.168.1.50:11434
  #   http://gpu-server.local:11434
  ollama_host: http://192.168.1.50:11434

  phase_mode: true               # сначала вся vision-фаза, потом вся text-фаза
  preload: true                  # прогревать модель пустым запросом
  unload_between_phases: true    # выгружать модели после фазы
  keep_alive: 30m                # сколько держать модель в VRAM внутри фазы

# ---------- Поведение при падении цепочек ----------
fallback:
  enabled: true                  # глобальный выключатель fallback-логики
  reduce_role: reduce            # имя роли для сжатия (по умолчанию)
  hard_truncate_sentences: 3     # сколько первых предложений оставить в крайнем случае
  auto_reduce_over_chars: 0      # авто-сжатие длинных ответов (0 = выключено)

# ---------- Роли (цепочки моделей) ----------
roles:

  # ============ Vision: описания кадров ============
  vision:
    fallback_role: reduce        # роль, к которой обратиться при падении всей цепочки
    empty_result: "Кадры этого места"
    chain:
      - backend: ollama
        model: minicpm-v4.5:8b
        label: local-minicpm
        keep_alive: 30m
        temperature: 0.4
        max_tokens: 400

      - backend: ollama
        model: llava:7b
        label: local-llava
        keep_alive: 30m
        temperature: 0.4
        max_tokens: 400

      - backend: ollama
        model: moondream:latest
        label: local-moondream
        temperature: 0.3
        max_tokens: 300

      - backend: groq
        model: llama-3.2-11b-vision-preview
        label: groq-vision
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        max_tokens: 400

      - backend: openrouter
        model: qwen/qwen-2.5-vl-72b-instruct:free
        label: openrouter-qwen-vl
        api_key_env: OPENROUTER_API_KEY
        base_url: https://openrouter.ai/api/v1
        max_tokens: 400

  # ============ Text: рассказ ============
  text:
    fallback_role: reduce
    empty_result: ""
    chain:
      - backend: ollama
        model: qwen2.5:7b
        label: local-qwen2.5
        keep_alive: 30m
        temperature: 0.85
        max_tokens: 1200

      - backend: groq
        model: llama-3.3-70b-versatile
        label: groq-70b
        api_key_env: GROQ_API_KEY
        base_url: https://api.groq.com/openai/v1
        temperature: 0.85
        max_tokens: 1200

      - backend: openrouter
        model: meta-llama/llama-3.3-70b-instruct:free
        label: openrouter-70b
        api_key_env: OPENROUTER_API_KEY
        base_url: https://openrouter.ai/api/v1
        temperature: 0.85
        max_tokens: 1200

      - backend: ollama
        model: qwen3.5:9b
        label: local-qwen3.5
        temperature: 0.85
        max_tokens: 1200

  # ============ Reduce: аварийное сжатие ============
  # Без fallback_role — иначе возможна рекурсия.
  reduce:
    empty_result: ""
    chain:
      - backend: ollama
        model: qwen2.5-coder:1.5b
        label: local-tiny
        keep_alive: 5m
        max_tokens: 250

      - backend: ollama
        model: qwen2.5:7b
        label: local-qwen2.5
        max_tokens: 250

# ---------- Параметры обработки ----------
processing:
  vision_max_side: 768           # до какого размера уменьшать фото для VLM
  export_max_side: 1600          # размер фото в HTML
  cluster_radius_m: 400          # радиус склейки кадров в «место»
  max_images_per_cluster: 4      # сколько кадров на кластер отдавать VLM
  use_reverse_geocode: true      # Nominatim (нужен интернет)

# ---------- Обогащение из интернета ----------
search:
  enabled: true
  language: ru
  max_chars: 600
  timeout: 8

# ---------- Вывод ----------
output:
  title: "Моё путешествие"
  theme: dark                    # dark | light